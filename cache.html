<!doctype html>
<html lang="en" manifest="cache.appcache">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OX PS4 · Offline Cache</title>
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
      background:#0b0d10;color:#e6ebf2;font:16px/1.5 monospace;text-align:center}
    main{width:min(88vw,520px);padding:28px;border:1px solid #263241;border-radius:12px;background:#11151b}
    h1{font-size:20px;letter-spacing:.12em}
    #status{margin:20px 0;color:#7fd0a0}
    #bar{height:9px;background:#263241;border-radius:10px;overflow:hidden}
    #fill{height:100%;width:0;background:#7fd0a0;transition:width .15s}
    #detail{font-size:12px;color:#9aa6b7;white-space:pre-wrap;margin-top:14px}
  </style>
</head>
<body>
<main>
  <h1>OX PS4 · OFFLINE CACHE</h1>
  <div id="status">Preparing offline files…</div>
  <div id="bar"><div id="fill"></div></div>
  <div id="detail">Keep this page open until caching finishes.</div>
</main>
<script>
(function(){
  var ac=window.applicationCache, status=document.getElementById("status");
  var detail=document.getElementById("detail"), fill=document.getElementById("fill");
  function done(message){
    status.textContent=message;
    fill.style.width="100%";
    detail.textContent="Offline files are ready. Returning to OX PS4…";
    setTimeout(function(){location.replace("index.html");},1400);
  }
  if(!ac){
    status.textContent="Application Cache is not supported";
    detail.textContent="This PS4 browser/server combination cannot use this cache method.";
    return;
  }
  ac.addEventListener("checking",function(){status.textContent="Checking cache…";});
  ac.addEventListener("downloading",function(){status.textContent="Downloading offline files…";});
  ac.addEventListener("progress",function(e){
    if(e.total){var p=Math.round(e.loaded/e.total*100);fill.style.width=p+"%";detail.textContent="Installing "+p+"% ("+e.loaded+"/"+e.total+")";}
  });
  ac.addEventListener("cached",function(){done("Offline cache installed ✓");});
  ac.addEventListener("noupdate",function(){done("Offline cache already current ✓");});
  ac.addEventListener("updateready",function(){
    try{ac.swapCache();}catch(e){}
    done("Offline cache updated ✓");
  });
  ac.addEventListener("error",function(){
    status.textContent="Cache installation failed";
    detail.textContent="Check that the server sends cache.appcache as text/cache-manifest and that all listed files exist. You can return to the launcher manually.";
  });
  if(ac.status===ac.IDLE || ac.status===ac.UPDATEREADY) done("Offline cache ready ✓");
})();
</script>
</body>
</html>
